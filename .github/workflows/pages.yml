name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      npm_config_prefer_offline: 'true'
      npm_config_fetch_timeout: '20000'
      npm_config_fetch_retries: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix visitor-api ci
      - run: npm --prefix visitor-api test
      - run: npm --prefix visitor-api run smoke:production
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:guide
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Alinguyen-portfolio
          NEXT_PUBLIC_SITE_URL: https://duytruyenthong.github.io/Alinguyen-portfolio
          NEXT_PUBLIC_VISITOR_API_URL: https://ali-portfolio-visitor-api.vercel.app/api/visit
          NEXT_PUBLIC_GUIDE_API_URL: https://ali-portfolio-visitor-api.vercel.app/api/guide
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
